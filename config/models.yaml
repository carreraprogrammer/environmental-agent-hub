# Model configurations
# Active model determined by CLASSIFIER_MODEL env var

models:
  # Single-model configurations
  openai-gpt4:
    provider: openai
    model: gpt-4-vision-preview
    cost_per_request: 0.010
    latency_p95_ms: 1500

  openai-gpt4o:
    provider: openai
    model: gpt-4o
    cost_per_request: 0.010
    latency_p95_ms: 800

  gemini:
    provider: google
    model: gemini-2.5-flash
    cost_per_request: 0.001
    latency_p95_ms: 600

  roboflow:
    provider: roboflow
    model: waste-classifier/1
    cost_per_request: 0.001
    latency_p95_ms: 400

  claude:
    provider: anthropic
    model: claude-3-sonnet
    cost_per_request: 0.015
    latency_p95_ms: 1200

  # Multi-model consensus configuration
  consensus:
    description: "Multi-model ensemble learning for improved accuracy"
    enabled: true
    uncertainty_threshold: 0.70  # Below this triggers consensus

    # Primary model (high accuracy, higher cost)
    primary:
      model: openai-gpt4o
      weight: 0.6

    # Secondary model (good accuracy, lower cost)
    secondary:
      model: gemini
      weight: 0.4

    # Tiebreaker model (fast, lightweight)
    tiebreaker:
      model: roboflow
      weight: 0.0  # Only used for tie-breaking

    # Strategy configuration
    strategies:
      agreement_boost:
        enabled: true
        confidence_bonus: 0.10
        description: "Both models agree on material type"

      confidence_based:
        enabled: true
        confidence_diff_threshold: 0.15
        penalty_factor: 0.90
        description: "Models disagree, pick winner by confidence"

      tie_breaker:
        enabled: true
        penalty_factor: 0.85
        description: "3rd model decides on marginal differences"

    # Performance characteristics
    performance:
      accuracy_improvement: "+4pp"  # 85% → 89%
      cost_avg: 0.0091  # Average across fast/consensus paths
      latency_p95_ms: 1200
      fast_path_ratio: 0.70  # 70% take fast path
      consensus_path_ratio: 0.30  # 30% trigger consensus
